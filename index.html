<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aetheria Addon Wiki</title>
    <meta name="description" content="Official Minecraft Bedrock Addon Wiki: Discover items, bosses, crafting recipes, ores, and custom biomes." />
    <meta name="google-adsense-account" content="ca-pub-9144292410564162">
    <!-- Google Search Structured Data (Site Navigation & Breadcrumb Schema) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://flygames.flyerserver.uk/#website",
            "url": "https://flygames.flyerserver.uk/",
            "name": "Aetheria Minecraft Addon Wiki",
            "description": "Comprehensive encyclopedia for Minecraft Bedrock custom addons, bosses, items, recipes, and biomes.",
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://flygames.flyerserver.uk/?search={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "BreadcrumbList",
            "@id": "https://flygames.flyerserver.uk/#breadcrumb",
            "itemListElement": [
              {
                "@type": "ListItem",
                "position": 1,
                "name": "Home",
                "item": "https://flygames.flyerserver.uk/"
              }
            ]
          }
        ]
      }
    </script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9144292410564162" crossorigin="anonymous"></script>
    <script>
      // Global blocker for benign sandbox WebSocket rejections
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var msg = reason && reason.message ? reason.message : String(reason || '');
        if (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('HMR') || msg.includes('vite')) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('error', function(event) {
        var msg = event.message || '';
        if (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('HMR') || msg.includes('vite')) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
